name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q

  sanitize:
    name: sanitize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block private paths and discussion leaks
        run: bash scripts/sanitize_check.sh

  cli-smoke:
    name: cli-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Demo + compare smoke
        run: |
          export PERSONALITY_PROTECT_HOME="${RUNNER_TEMP}/pp-home"
          personality-protect --logo off demo --home "$PERSONALITY_PROTECT_HOME" --json
          personality-protect --logo off compare \
            --home "$PERSONALITY_PROTECT_HOME" --profile demo \
            --synthetic slop_branding --backend mock --json
          personality-protect --logo off train \
            --home "$PERSONALITY_PROTECT_HOME" --profile demo \
            --backend mock --smoke --force --json
